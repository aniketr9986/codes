<!DOCTYPE html>

<html>
<head>
    <title>My Login Page</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

```
    .login-box {
        background: white;
        padding: 30px;
        width: 300px;
        border-radius: 10px;
        text-align: center;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
    }

    button {
        width: 100%;
        padding: 10px;
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>
```

</head>
<body>

```
<div class="login-box">
    <h2>Welcome Back!</h2>
    <h3>Login</h3>

    <form>
        <input type="text" placeholder="Enter Username" required>
        <input type="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? Sign Up</p>
</div>
```

</body>
</html>
